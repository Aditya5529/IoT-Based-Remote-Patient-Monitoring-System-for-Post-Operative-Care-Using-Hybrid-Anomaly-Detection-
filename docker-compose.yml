version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: rpm_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://rpm_user:rpm_password@db:5432/rpm_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=supersecretkeyForDevelopmentOnly
      - ALLOWED_ORIGINS=["http://localhost:5173","http://localhost:3000","http://localhost:8000"]
    depends_on:
      - db
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend_new
      dockerfile: Dockerfile
    container_name: rpm_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend_new:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      - backend

  db:
    image: postgres:15-alpine
    container_name: rpm_db
    environment:
      - POSTGRES_USER=rpm_user
      - POSTGRES_PASSWORD=rpm_password
      - POSTGRES_DB=rpm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: rpm_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
